# Runs the test suite on every OS. Besides catching platform bugs, this is what
# makes the byte-identical-output guarantee checkable across operating systems:
# tests/test_determinism.py pins the SHA-256 of `aspark-policy resolve` output,
# and every OS in this matrix must reproduce the same constants.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest
