[project]
name = "aspark-policy"
version = "0.3.0"
description = "Enterprise Policy-as-Code for the aSPARK product family."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andreas Lottes" }]
keywords = ["aspark", "policy-as-code", "governance", "engineering-standards"]

# PyYAML is the only runtime dependency (constitution §3, spec D1): it parses
# policy.yaml/pack.yaml for `aspark-policy resolve` and `validate`. The CLI is
# wired below (resolve-cli increment).
dependencies = ["PyYAML>=6.0"]

[project.scripts]
aspark-policy = "aspark_policy._cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.20"]

[project.urls]
Homepage = "https://github.com/a-lottes/aSPARK-policy"
Repository = "https://github.com/a-lottes/aSPARK-policy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aspark_policy"]

# Ship the pack catalog inside the wheel so `aspark:` imports resolve for an
# installed CLI, not only from a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"packs" = "aspark_policy/packs"

[tool.pytest.ini_options]
testpaths = ["tests"]
