# The rule fragment contributed by the UN R155 pack. Merged into the effective
# policy when a project imports `aspark:un-r155`. As a `universal` pack, a
# corporate level may mark this block `final: true` — the pack itself never
# sets `final` (only a downstream org/project policy does).

rules:
  compliance:
    un_r155: true

    # Each control maps to a real UN R155 CSMS structural element — the
    # regulation's Cyber Security Management System requirements over the
    # vehicle lifecycle (development, production, post-production). Cited at
    # provision level; no ISO/SAE 21434 clause text is reproduced.
    controls:
      csms_established: required          # A defined, auditable Cyber Security Management System governs the vehicle type
      risk_identification: required       # Cyber security risks are identified across the vehicle lifecycle
      risk_assessment_treatment: required # Identified risks are assessed and treated (mitigated/accepted with justification)
      security_by_design: required        # Risk treatment is applied in the design of the vehicle and its systems
      supplier_management: required       # Suppliers' cyber security responsibilities are managed and evidenced
      monitoring_detection: required      # Attacks and vulnerabilities are monitored and detected in the field
      incident_response: required         # A capability to respond to detected cyber attacks/incidents exists
      post_production_updates: required   # Vulnerabilities are managed and remediated post-production over the lifecycle
