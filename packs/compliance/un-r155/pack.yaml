# Metadata for the UN R155 pack. Read by the Facilitator during /charter to
# resolve `imports: [aspark:un-r155]` into effective rules and constraints.

id: un-r155                  # the flat import id: aspark:un-r155
category: compliance         # on-disk grouping only, not part of the id
kind: universal              # an external regulation, identical for every org → may be `final`
version: 1                   # pack content version (bump on rule changes)

# UN R155's Cyber Security Management System (CSMS) is security-technical
# governance over the vehicle lifecycle → maps onto aSPARK Core's `security`
# lens, like `owasp` and `pci-dss`.
maps_to_lens: security

summary: >
  UN Regulation No. 155 (WP.29) — the vehicle Cyber Security Management System
  (CSMS) — as aSPARK's own summary interpretation. The automotive-cybersecurity
  industry anchor, deliberately anchored on the PUBLIC UN regulation rather
  than the paid ISO/SAE 21434 engineering standard (which is named only as the
  related standard, never reproduced). Feeds the Engineering Manager
  (security-by-design decisions), the Developer (secure implementation), the
  Reviewer (control enforcement) and the Release Manager (release-blocking
  controls). This is NOT a type-approval artifact — see the disclaimer in
  compliance.md.

references:
  - https://unece.org/transport/documents/2021/03/standards/un-regulation-no-155-cyber-security-and-cyber-security
